<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005c55" />
      <stop offset="100%" stop-color="#003833" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9cf2e8" />
      <stop offset="100%" stop-color="#80d5cb" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb690" />
      <stop offset="100%" stop-color="#af4c00" />
    </linearGradient>
  </defs>

  <!-- Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Subtle Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#80d5cb" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.8" />
  <circle cx="32" cy="32" r="23" fill="none" stroke="#9cf2e8" stroke-width="1" opacity="0.4" />

  <!-- Compass / Star / Travel Globe Lines -->
  <!-- Longitude Arc -->
  <path d="M 32 12 A 12 20 0 0 1 32 52 A 12 20 0 0 1 32 12" fill="none" stroke="#9cf2e8" stroke-width="1.5" opacity="0.4" />
  <!-- Equator Line -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#9cf2e8" stroke-width="1.5" opacity="0.4" />

  <!-- Expedition Star / Compass Needle -->
  <!-- North Arrow (Gold/Teal) -->
  <polygon points="32,15 36.5,30 32,32" fill="#9cf2e8" />
  <polygon points="32,15 27.5,30 32,32" fill="#80d5cb" />
  
  <!-- South Arrow (Warm Amber) -->
  <polygon points="32,49 36.5,34 32,32" fill="url(#needleGrad)" />
  <polygon points="32,49 27.5,34 32,32" fill="#893a00" />

  <!-- East Arrow -->
  <polygon points="49,32 34,27.5 32,32" fill="#9cf2e8" opacity="0.9" />
  <polygon points="49,32 34,36.5 32,32" fill="#80d5cb" opacity="0.9" />

  <!-- West Arrow -->
  <polygon points="15,32 30,27.5 32,32" fill="#9cf2e8" opacity="0.7" />
  <polygon points="15,32 30,36.5 32,32" fill="#80d5cb" opacity="0.7" />

  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#003833" />
</svg>
